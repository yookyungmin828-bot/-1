/* ===== 데이터 =====
   사진 속 목록에 맞게 아래 배열을 수정/추가하세요: [사자성어, 독음, 뜻, 유래] */
const BASE=[
['甘言利說','감언이설','귀가 솔깃하도록 달콤한 말과 이로운 조건을 내세워 남을 꾀는 말.','듣기 좋은 말로 비위를 맞추고 이익을 내세워 꾀는 모습에서 굳어진 말입니다. 특정 고사보다는 관용적으로 쓰이며, 사기·유혹 상황에서 자주 쓰입니다.'],
['苦盡甘來','고진감래','쓴 것이 다하면 단 것이 온다는 뜻으로, 고생 끝에 즐거움이 옴.','어려움을 견디고 나면 좋은 때가 찾아온다는 뜻으로, 힘든 시기를 위로하거나 격려할 때 씁니다.'],
['累卵之勢','누란지세','알을 쌓아 놓은 것처럼 매우 위태로운 형세.','『사기』에 전하는 범저(范雎) 이야기에서, 진나라의 형세가 알을 쌓아 놓은 것보다 위태롭다고 한 말에서 비롯되었다고 합니다.'],
['塞翁之馬','새옹지마','인생의 길흉화복은 예측하기 어려워 늘 변화가 많음.','『회남자』에 나옵니다. 변방 노인의 말이 달아났다가 준마를 데려왔고, 아들이 그 말에서 떨어져 다리를 다쳤지만 덕분에 전쟁에 끌려가지 않았다는 이야기입니다.'],
['轉禍爲福','전화위복','재앙이 바뀌어 오히려 복이 됨.','『사기』 등에서 "화를 원인으로 삼아 복을 만든다"는 표현에서 비롯되었습니다. 나쁜 일을 잘 활용해 좋은 결과로 바꾼다는 뜻입니다.'],
['臥薪嘗膽','와신상담','섶에 눕고 쓸개를 맛본다는 뜻으로, 원수를 갚으려고 온갖 고난을 참고 견딤.','중국 춘추시대 오나라 부차는 섶에 누워 월나라 구천에게 복수를 다짐했고, 패한 구천은 쓸개를 맛보며 치욕을 잊지 않아 결국 부차를 무찔렀습니다.'],
['結草報恩','결초보은','죽어서도 은혜를 잊지 않고 갚음.','『춘추좌씨전』에 나옵니다. 위과가 아버지의 첩을 순장하지 않고 시집보내 주었는데, 훗날 전쟁터에서 그 아버지의 혼이 풀을 묶어 적장을 넘어뜨려 위과를 도왔다는 이야기입니다.'],
['刻舟求劍','각주구검','판단력이 둔하여 시세의 변화를 모르고 어리석게 고집함.','『여씨춘추』에 나옵니다. 초나라 사람이 배에서 칼을 강에 빠뜨리자 뱃전에 표시를 새기고, 배가 멈춘 뒤 그 자리에서 칼을 찾으려 했다는 이야기입니다.'],
['漁父之利','어부지리','둘이 다투는 사이에 제3자가 이익을 봄.','『전국책』에 나옵니다. 도요새와 조개가 서로 물고 다투는 사이 지나가던 어부가 둘 다 잡았다는 이야기로, 소대가 조나라 왕을 설득할 때 든 비유입니다.'],
['守株待兔','수주대토','한 가지 일에만 얽매여 발전이 없음. 요행을 바람.','『한비자』에 나옵니다. 송나라 농부가 토끼가 그루터기에 부딪혀 죽은 것을 보고, 농사를 그만두고 그루터기만 지키며 토끼를 기다렸다는 이야기입니다.'],
['他山之石','타산지석','다른 산의 나쁜 돌도 내 옥을 가는 데 쓸 수 있듯, 남의 하찮은 말과 행동도 나의 수양에 도움이 됨.','『시경』 소아 학명 편에서 비롯되었습니다. 다른 사람의 잘못을 보고 자신을 돌아본다는 뜻으로 쓰입니다.'],
['雪上加霜','설상가상','눈 위에 서리가 덮인다는 뜻으로, 불행이 거듭 겹침.','불교 서적 『경덕전등록』 등에 쓰인 표현입니다. 어려운 일이 겹칠 때 씁니다.'],
['大器晩成','대기만성','큰 그릇은 늦게 이루어진다는 뜻으로, 크게 될 사람은 늦게 이루어짐.','『노자』 41장의 "큰 그릇은 늦게 이루어진다"에서 비롯되었습니다. 오랜 노력 끝에 뒤늦게 성공하는 사람을 말합니다.'],
['螢雪之功','형설지공','반딧불과 눈빛으로 글을 읽으며 이룬 공이라는 뜻으로, 고생하며 부지런히 공부한 보람.','『진서』에 나옵니다. 가난했던 차윤은 반딧불로, 손강은 눈빛으로 책을 읽으며 공부해 훗날 높은 벼슬에 올랐다고 합니다.'],
['管鮑之交','관포지교','관중과 포숙아의 사귐이라는 뜻으로, 서로 이해하고 믿는 매우 친밀한 우정.','『사기』에 나옵니다. 포숙아는 가난하고 실수가 많던 친구 관중을 끝까지 믿고 도와, 관중이 제나라 재상이 되게 했습니다.'],
['甘吞苦吐','감탄고토','달면 삼키고 쓰면 뱉는다는 뜻으로, 자기 비위에 맞으면 받아들이고 맞지 않으면 버림.','특정 고사나 출전은 확인되지 않았습니다. “달면 삼키고(甘吞) 쓰면 뱉는다(苦吐)”는 말뜻 그대로 굳어진 표현입니다.'],
['孤立無援','고립무원','고립되어 구원을 받을 데가 없음.','특정 고사나 출전은 확인되지 않았습니다. “외로이 서 있고(孤立) 도움이 없다(無援)”는 말뜻 그대로 쓰입니다.'],
['群鷄一鶴','군계일학','닭의 무리 가운데 한 마리의 학이라는 뜻으로, 많은 사람 가운데서 뛰어난 한 사람.','『진서』 혜소전에 전하는 이야기에서 비롯되었다고 합니다. 진나라 혜소(嵇紹)의 늠름한 모습을 보고 “닭의 무리 속에 있는 학 같다”고 한 말입니다.'],
['東問西答','동문서답','동쪽을 묻는데 서쪽을 대답한다는 뜻으로, 묻는 말과 상관없는 엉뚱한 대답.','특정 고사나 출전은 확인되지 않았습니다. “동쪽을 묻는데 서쪽으로 답한다”는 말뜻 그대로 쓰입니다.'],
['同病相憐','동병상련','같은 병을 앓는 사람끼리 서로 가엾게 여긴다는 뜻으로, 처지가 비슷한 사람끼리 서로 동정하고 도움.','『오월춘추』에 나오는 오자서의 말에서 비롯되었다고 합니다. 오자서가 같은 처지의 백비를 받아들이며 “같은 병은 서로 불쌍히 여기고 같은 근심은 서로 구한다”는 뜻의 말을 했다고 전합니다.'],
['同床異夢','동상이몽','같은 잠자리에서 서로 다른 꿈을 꾼다는 뜻으로, 겉으로는 같이 행동하면서 속으로는 각기 다른 생각을 함.','정확한 출전은 확인하지 못했습니다. “같은 침상(同床)에서 다른 꿈(異夢)”이라는 말뜻 그대로 쓰입니다.'],
['傍若無人','방약무인','곁에 사람이 없는 것처럼 거리낌 없이 제멋대로 행동함.','『사기』 자객열전에 나옵니다. 형가가 연나라 저잣거리에서 친구 고점리와 술을 마시며 노래하고 울기를 곁에 아무도 없는 듯이 했다는 이야기에서 비롯되었습니다.'],
['事必歸正','사필귀정','모든 일은 반드시 바른 이치대로 돌아감.','특정 고사나 출전은 확인되지 않았습니다. “일은 반드시 바른 데로 돌아간다”는 말뜻 그대로 쓰입니다.'],
['手不釋卷','수불석권','손에서 책을 놓지 않는다는 뜻으로, 늘 열심히 공부함.','정확한 출전은 확인하지 못했습니다. “손에서 책을 놓지 않는다”는 말뜻 그대로 쓰입니다.'],
['言中有骨','언중유골','말 속에 뼈가 있다는 뜻으로, 예사로운 말 속에 단단한 속뜻이 들어 있음.','특정 고사나 출전은 확인되지 않았습니다. 평범해 보이는 말 속에 비판이나 불만 같은 속뜻이 담겨 있을 때 씁니다.'],
['類類相從','유유상종','같은 무리끼리 서로 따르고 사귐.','정확한 출전은 확인하지 못했습니다. “같은 부류끼리 서로 따른다”는 말뜻 그대로 쓰입니다.'],
['以熱治熱','이열치열','열로써 열을 다스린다는 뜻으로, 힘에는 힘으로 맞서 대응함.','특정 고사나 출전은 확인되지 않았습니다. 더운 여름에 뜨거운 음식을 먹어 더위를 이기는 경우 등에 흔히 씁니다.'],
['以心傳心','이심전심','마음에서 마음으로 전한다는 뜻으로, 말이나 글로 하지 않아도 서로 마음이 통함.','불교 선종에서 말이나 글이 아니라 마음으로 깨달음을 전한다는 뜻으로 쓰이던 표현에서 비롯되었다고 합니다.'],
['千載一遇','천재일우','천 년에 한 번 만난다는 뜻으로, 좀처럼 얻기 어려운 좋은 기회.','진(晉)나라 원굉이 『삼국명신서찬』에서 어진 임금과 신하의 만남을 “천 년에 한 번 있는 만남”이라고 한 데서 비롯되었다고 합니다.'],
['寸鐵殺人','촌철살인','한 치의 쇠붙이로도 사람을 죽일 수 있다는 뜻으로, 짧은 말 한마디로 상대의 급소를 찌르거나 감동시킴.','송나라 나대경의 『학림옥로』에서 선(禪)의 가르침을 설명하며 쓴 표현에서 비롯되었다고 전합니다.'],
['針小棒大','침소봉대','바늘만 한 것을 몽둥이만 하다고 말한다는 뜻으로, 작은 일을 크게 부풀려 말함.','특정 고사나 출전은 확인되지 않았습니다. “작은 바늘(針小)을 큰 몽둥이(棒大)처럼 말한다”는 말뜻 그대로 쓰입니다.'],
['表裏不同','표리부동','겉과 속이 같지 않다는 뜻으로, 겉으로 드러난 말·행동과 속마음이 다름.','특정 고사나 출전은 확인되지 않았습니다. 겉(表)과 속(裏)이 같지 않다(不同)는 말뜻 그대로 쓰입니다.'],
['風前燈火','풍전등화','바람 앞의 등불이라는 뜻으로, 매우 위태로운 처지.','특정 고사나 출전은 확인되지 않았습니다. 바람 앞에 놓인 등불처럼 곧 꺼질 듯 위태로운 상황을 말합니다.'],
['狐假虎威','호가호위','여우가 호랑이의 위세를 빌려 으스댄다는 뜻으로, 남의 권세를 빌려 위세를 부림.','『전국책』 초책에 나옵니다. 강을이 초나라 선왕에게, 여우가 호랑이를 앞세워 다른 짐승들이 도망치게 만든 이야기를 들어 소해휼이 왕의 위세를 빌리고 있다고 비유했습니다.']
];

/* ===== 지우개 엔진: 렌더링과 무관한 순수 함수 (좌표 배열만 다룸) =====
   Stroke = { id, color, width, points: [[x, y], ...] }   (좌표계: 논리 600×400)
   strokes = Stroke[]  ← 지우개 함수는 항상 "새 배열"을 돌려주고, 바뀐 것이 없으면 같은 배열을 그대로 돌려줍니다. */
const PEN_PX=6, ERASER_PX=24;                 /* 슬라이더 값 1.0 당 논리 px (펜: 굵기, 지우개: 지름) */
const penWidth=v=>+(v*PEN_PX).toFixed(2);     /* 펜 두께 0.1~2.0 → 선 굵기(px) */
const eraserRadius=v=>v*ERASER_PX/2;          /* 지우개 두께 0.1~2.0 → 반지름(px) */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clampSize=v=>Math.round(Math.min(2,Math.max(0.1,+v||1))*10)/10;

function distToSeg(px,py,ax,ay,bx,by){        /* 점과 선분 사이의 최단 거리 */
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  const t=l2?Math.min(1,Math.max(0,((px-ax)*dx+(py-ay)*dy)/l2)):0;
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}

/* [획 지우개] 판별: 터치 원(반지름 r)이 선(굵기 포함)을 스쳤는가 */
function hitsStroke(st,x,y,r){
  const p=st.points,reach=r+st.width/2;
  if(p.length===1)return Math.hypot(x-p[0][0],y-p[0][1])<=reach;
  for(let i=0;i<p.length-1;i++)if(distToSeg(x,y,p[i][0],p[i][1],p[i+1][0],p[i+1][1])<=reach)return true;
  return false;
}
function eraseStrokeAt(strokes,x,y,r){        /* 스친 선은 통째로 삭제 */
  const out=strokes.filter(s=>!hitsStroke(s,x,y,r));
  return out.length===strokes.length?strokes:out;
}

/* [표준 지우개] 판별: 선을 원(반지름 r + 선굵기/2)과의 교점에서 잘라, 원 밖의 조각들만 남김 */
function cutStroke(st,cx,cy,r){
  const R=r+st.width/2,P=st.points,ins=(x,y)=>Math.hypot(x-cx,y-cy)<R,rd=v=>+v.toFixed(1);
  if(P.length===1)return ins(P[0][0],P[0][1])?[]:[st];
  const pieces=[];let cur=ins(P[0][0],P[0][1])?[]:[P[0]],cut=cur.length===0;
  for(let i=0;i<P.length-1;i++){
    const [ax,ay]=P[i],[bx,by]=P[i+1],dx=bx-ax,dy=by-ay,fx=ax-cx,fy=ay-cy;
    const A=dx*dx+dy*dy,B=2*(fx*dx+fy*dy),C=fx*fx+fy*fy-R*R,D=B*B-4*A*C;
    let t1=1,t2=0;                              /* 선분 위에서 원 안에 들어가는 구간 [t1,t2] */
    if(A>0&&D>0){const q=Math.sqrt(D);t1=Math.max(0,(-B-q)/(2*A));t2=Math.min(1,(-B+q)/(2*A))}
    if(!(t1<t2)){if(cur.length)cur.push(P[i+1]);continue}
    cut=true;const at=t=>[rd(ax+dx*t),rd(ay+dy*t)];
    if(t1>0){cur.push(at(t1));pieces.push(cur)}  /* 원 밖→안: 경계에서 조각 끝 */
    cur=t2<1?[at(t2),P[i+1]]:[];                 /* 원 안→밖: 경계에서 새 조각 시작 */
  }
  if(cur.length)pieces.push(cur);
  return cut?pieces.filter(p=>p.length>1).map(p=>({...st,id:uid(),points:p})):[st];
}
function eraseStandardAt(strokes,x,y,r){
  let changed=false;const out=[];
  for(const st of strokes){const res=cutStroke(st,x,y,r);if(res.length===1&&res[0]===st)out.push(st);else{changed=true;out.push(...res)}}
  return changed?out:strokes;
}

/* 모드 분기 + 빠르게 쓸어도 빠뜨리지 않도록 이동 경로를 촘촘히 보간 */
const eraseAt=(strokes,mode,x,y,r)=>mode==='stroke'?eraseStrokeAt(strokes,x,y,r):eraseStandardAt(strokes,x,y,r);
function eraseAlong(strokes,mode,from,to,r){
  const d=Math.hypot(to[0]-from[0],to[1]-from[1]),n=Math.max(1,Math.ceil(d/Math.max(1,r/2)));let s=strokes;
  for(let k=1;k<=n;k++)s=eraseAt(s,mode,from[0]+(to[0]-from[0])*k/n,from[1]+(to[1]-from[1])*k/n,r);
  return s;
}

/* 예전 저장 형식 {c,w,p,e}(지우개를 덧그린 방식) → 새 형식으로 변환 (예전 지우개 획은 표준 지우개로 다시 적용) */
function normStrokes(arr){
  let out=[];
  for(const s of arr||[]){
    if(s.points){out.push(s);continue}
    if(s.e){let last=s.p[0];out=eraseAt(out,'standard',last[0],last[1],s.w/2);for(const q of s.p.slice(1)){out=eraseAlong(out,'standard',last,q,s.w/2);last=q}}
    else out.push({id:uid(),color:s.c,width:s.w,points:s.p});
  }
  return out;
}

          <button id="mm-t-stroke" class="b text-sm py-1" onclick="A.memoTool('stroke')">획 지우개</button>

        <div class="flex gap-2"><button class="b text-sm py-1" onclick="A.memoUndo()">되돌리기</button><button class="b text-sm py-1" onclick="A.memoClear()">모두 지우기</button></div>
      </div>
      <canvas id="mc" width="1200" height="800" aria-label="손글씨 메모 영역" class="w-full rounded-lg border border-[#C9D2CB]" style="width:100%;height:auto;touch-action:none;user-select:none;background-image:linear-gradient(#E4E9E5 1px,transparent 1px);background-size:100% 10%"></canvas>
    </div>
    <div id="tp" class="hidden"><textarea id="mt" rows="10" aria-label="텍스트 메모" oninput="A.memoText()" placeholder="텍스트 메모를 입력하세요" class="w-full px-4 py-3 rounded-lg border border-[#C9D2CB]">${esc(t)}</textarea></div>
    <p id="ms" role="status" class="text-xs text-slate-500 mt-2">변경 사항은 이 브라우저에 자동으로 저장됩니다.</p>

function memoUi(){
  $('#pp').classList.toggle('hidden',MS.mode!=='pen');$('#tp').classList.toggle('hidden',MS.mode!=='txt');
  [['#mm-pen',MS.mode==='pen'],['#mm-txt',MS.mode==='txt'],['#mm-t-pen',MS.tool==='pen'],['#mm-t-standard',MS.tool==='standard'],['#mm-t-stroke',MS.tool==='stroke']].forEach(([q,on])=>{const e=$(q);e.classList.toggle('on',on);e.setAttribute('aria-pressed',on)});
  document.querySelectorAll('.mc').forEach(b=>b.classList.toggle('sel',MS.tool==='pen'&&b.dataset.c===MS.color));
}
function memoDraw(){
  const c=MS.ctx;c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,600,400);c.lineCap='round';c.lineJoin='round';
  for(const st of MS.strokes){
    c.strokeStyle=c.fillStyle=st.color;c.lineWidth=st.width;const p=st.points;
    if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],st.width/2,0,7);c.fill();continue}
    c.beginPath();c.moveTo(p[0][0],p[0][1]);
    for(let k=1;k<p.length-1;k++)c.quadraticCurveTo(p[k][0],p[k][1],(p[k][0]+p[k+1][0])/2,(p[k][1]+p[k+1][1])/2);
    c.lineTo(p[p.length-1][0],p[p.length-1][1]);c.stroke();
  }
  if(MS.ring){c.strokeStyle='rgba(90,100,110,.9)';c.lineWidth=1;c.beginPath();c.arc(MS.ring[0],MS.ring[1],eraserRadius(MS.ers),0,7);c.stroke()}
}
function memoSave(){
  if(MS.key===null)return;
  const te=document.querySelector('#mt'),t=te?te.value:((MEMOS[MS.key]||{}).t||'');
  if(!t.trim()&&!MS.strokes.length)delete MEMOS[MS.key];else MEMOS[MS.key]={t,s:MS.strokes,u:Date.now()};
  let ok=true;try{localStorage.setItem('memos',JSON.stringify(MEMOS))}catch(e){ok=false}
  const st=document.querySelector('#ms');if(st)st.textContent=ok?'저장됨':'저장하지 못했어요. 브라우저 저장 공간을 확인해 주세요.';
}
function memoCanvas(){
  const cv=$('#mc');MS.cv=cv;MS.ctx=cv.getContext('2d');
  const pt=e=>{const r=cv.getBoundingClientRect();return [+((e.clientX-r.left)*600/r.width).toFixed(1),+((e.clientY-r.top)*400/r.height).toFixed(1)]};
  cv.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId)}catch(_){}
    const p=pt(e);MS.snap=MS.strokes;
    if(MS.tool==='pen'){MS.cur={id:uid(),color:MS.color,width:penWidth(MS.pen),points:[p]};MS.strokes=[...MS.strokes,MS.cur]}
    else{MS.cur={last:p};MS.ring=p;MS.strokes=eraseAt(MS.strokes,MS.tool,p[0],p[1],eraserRadius(MS.ers))}
    memoDraw();e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{
    if(!MS.cur)return;
    let evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!evs.length)evs=[e];
    for(const ev of evs){const p=pt(ev);
      if(MS.tool==='pen'){const l=MS.cur.points[MS.cur.points.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>=0.6)MS.cur.points.push(p)}
      else{MS.strokes=eraseAlong(MS.strokes,MS.tool,MS.cur.last,p,eraserRadius(MS.ers));MS.cur.last=p;MS.ring=p}}
    memoDraw();e.preventDefault();
  });
  const end=()=>{
    if(!MS.cur)return;MS.cur=null;MS.ring=null;
    if(MS.strokes!==MS.snap){MS.hist.push(MS.snap);if(MS.hist.length>50)MS.hist.shift()}   /* 실제로 바뀐 동작만 되돌리기 기록 */
    memoDraw();memoSave();
  };
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  memoDraw();
}
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(DS.open)A.dictClose();else if(MS.key!==null)A.memoClose()});

  const chHtml=cs.map(c=>{const r=CH[c],[eum,mean,bu,st]=r?r.split('|'):[];

}

function pool(){return S.cfg.scope==='sel'?[...S.sel]:S.cfg.scope==='bm'?[...S.bm]:I.map((_,i)=>i)}
function vQuiz(){
  const q=S.quiz, c=S.cfg;
  const seg=(k,opts)=>`<div class="flex flex-wrap gap-2 mb-4">${opts.map(([v,l])=>`<button class="b ${c[k]===v?'on':''}" onclick="A.cfg('${k}','${v}')">${l}</button>`).join('')}</div>`;
  if(!q){
    const n=pool().length;
    return `<h2 class="font-bold mb-2">퀴즈 유형</h2>${seg('type',[['mix','섞어서'],['mc','뜻→객관식'],['sub','뜻→주관식'],['blank','빈칸 채우기']])}
    <h2 class="font-bold mb-2">범위</h2>${seg('scope',[['all','전체'],['sel','선택 항목('+S.sel.size+')'],['bm','북마크('+S.bm.size+')']])}
    <h2 class="font-bold mb-2">문제 수</h2>${seg('n',[['5','5'],['10','10'],['99','범위 전체']])}
    <p class="text-sm text-slate-600 mb-3">출제 대상 ${n}개${n?'':' — 범위에 항목이 없습니다. 학습 선택 탭에서 고르거나 전체를 선택하세요.'}</p>
    <button class="b bp w-full py-3" ${n?'':'disabled style="opacity:.4"'} onclick="A.start()">퀴즈 시작</button>`;
  }
  if(q.done){
    return `<div class="card p-5 text-center mb-4"><div class="text-sm text-slate-500">점수</div><div class="text-4xl font-bold">${q.score} / ${q.qs.length}</div></div>
    <div class="space-y-2 mb-4">${q.qs.map((Q,k)=>`<div class="card p-3 ${Q.ok?'ok':'no'}"><div class="text-sm">${k+1}. ${Q.ok?'정답':'오답'} · ${Q.t==='blank'?hLinks(Q.p):esc(Q.p)}</div><div class="text-sm mt-1">정답: <b class="han">${hLinks(Q.show)}</b>${Q.ok?'':` / 내 답: ${esc(Q.us)}`}</div></div>`).join('')}</div>
    <div class="grid grid-cols-1 gap-2"><button class="b" onclick="A.wrongBm()">틀린 문제 북마크에 담기</button><button class="b bp" onclick="A.start()">같은 설정으로 다시 풀기</button><button class="b" onclick="A.reset()">설정으로 돌아가기</button></div>`;
  }
  const Q=q.qs[q.i], done=Q.u!==undefined;
  let body='';
  if(Q.t==='sub') body=`<input id="ans" ${done?'disabled':''} value="${done?esc(Q.us):''}" onkeydown="if(event.key==='Enter')A.sub()" placeholder="한자 또는 한글 독음 입력" class="w-full px-4 py-3 rounded-lg border border-[#C9D2CB] bg-white han text-lg mb-2">${done?'':'<button class="b bp w-full" onclick="A.sub()">제출</button>'}`;
  else body=`<div class="grid grid-cols-2 gap-2">${Q.o.map((o,k)=>{const lab=Q.t==='mc'?`<span class="han text-lg">${I[o][0]}</span><span class="block text-xs text-slate-500">${I[o][1]}</span>`:`<span class="han text-3xl">${o}</span>`;const cls=!done?'':(o===Q.a?'ok':(k===Q.sel?'no':''));return `<button class="b py-3 ${cls}" ${done?'disabled':''} onclick="A.pick(${k})">${lab}</button>`}).join('')}</div>`;
  return `<div class="flex justify-between mb-3 text-sm"><span>${q.i+1} / ${q.qs.length}</span><span>${{mc:'객관식',sub:'주관식',blank:'빈칸 채우기'}[Q.t]}</span></div>
  <div class="card p-5 mb-3"><p class="${Q.t==='blank'?'han text-3xl text-center font-bold':''}">${Q.t==='blank'?hLinks(Q.p):esc(Q.p)}</p>${Q.t==='blank'?`<p class="text-sm text-slate-600 text-center mt-3">${esc(Q.hint)}</p>`:''}</div>${body}
  ${done?`<div class="card p-3 mt-3 ${Q.ok?'ok':'no'}">${Q.ok?'정답입니다!':'오답입니다.'} 정답: <b class="han">${hLinks(Q.show)}</b></div><button class="b bp w-full mt-3" onclick="A.next()">${q.i+1<q.qs.length?'다음 문제':'결과 보기'}</button>`:''}`;
}
function buildQ(i,type){
  const [h,r,m]=I[i], t=type==='mix'?['mc','sub','blank'][Math.random()*3|0]:type;
  if(t==='mc'){const o=shuf([i,...shuf(I.map((_,k)=>k).filter(k=>k!==i)).slice(0,3)]);return{t,p:m,a:i,o,show:`${h} (${r})`};}
  if(t==='sub') return{t,p:m,h,r,show:`${h} (${r})`};
  const pos=Math.random()*h.length|0, c=h[pos], p=[...h].map((x,k)=>k===pos?'( )':x).join('');
  const o=shuf([c,...shuf([...new Set([...Object.keys(CH),...(I.map(x=>x[0]).join('').match(/[\u3400-\u9FFF]/g)||[])])].filter(x=>x!==c)).slice(0,3)]);
  return{t,p,hint:`뜻: ${m}`,a:c,o,show:`${c} → ${h} (${r})`};
}

  memoMode(m){MS.mode=m;memoUi()},

  dictPick(i){A.dictClose();A.open(i)},
  open(i){S.open=i;S.ch=null;render()},
  close(){S.open=null;S.ch=null;render()},
  async ch(c){S.ch=await lookupHanja(c)||{ch:c};render()},
  bm(i){S.bm.has(i)?S.bm.delete(i):S.bm.add(i);save();render()},
  sel(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);save();render()},
  all(on){S.sel=on?new Set(I.map((_,i)=>i)):new Set();save();render()},
  study(src){const ids=src==='sel'?[...S.sel]:[...S.bm];S.study={ids:shuf(ids),i:0,flip:false};render()},
  endStudy(){S.study=null;render()},
  flip(){S.study.flip=!S.study.flip;render()},
  mv(d){const s=S.study;s.i=(s.i+d+s.ids.length)%s.ids.length;s.flip=false;render()},
  reshuf(){S.study.ids=shuf(S.study.ids);S.study.i=0;S.study.flip=false;render()},
  goQuiz(sc){S.cfg.scope=sc;S.quiz=null;S.study=null;S.tab='quiz';render()},
  cfg(k,v){S.cfg[k]=k==='n'?+v:v;render()},
  start(){const ids=shuf(pool()).slice(0,S.cfg.n);S.quiz={qs:ids.map(i=>({...buildQ(i,S.cfg.type),i})),i:0,score:0,done:false};render()},
  reset(){S.quiz=null;render()},
  pick(k){const Q=S.quiz.qs[S.quiz.i];if(Q.u!==undefined)return;Q.sel=k;Q.u=Q.o[k];Q.us=Q.t==='mc'?I[Q.u][0]:Q.u;Q.ok=Q.u===Q.a;if(Q.ok)S.quiz.score++;render()},
  sub(){const Q=S.quiz.qs[S.quiz.i];if(Q.u!==undefined)return;const v=$('#ans').value.trim();if(!v)return;Q.u=v;Q.us=v;Q.ok=norm(v)===norm(Q.h)||norm(v)===norm(Q.r);if(Q.ok)S.quiz.score++;render()},
  next(){const q=S.quiz;q.i++;if(q.i>=q.qs.length){q.i=q.qs.length-1;q.done=true}render()},
  form(k,v){S.form[k]=v},
  err(m){S.err=m;S.msg='';render()},
  adminLogin(){
    if(S.admin){A.tab('admin');return}
    const pw=prompt('관리자 비밀번호');if(pw===null)return;
    if(pw!==ADMIN_PW){alert('비밀번호가 맞지 않습니다.');return}
    S.admin=true;ssSet('adm','1');
    const dr=ld('sharedDraft',null);if(Array.isArray(dr)){SHARED=dr.filter(okEntry);rebuild()}
    A.tab('admin');
  },
  adminLogout(){ssSet('adm','0');location.reload()},
  adminAdd(){
    const f=S.form,h=(f.ah||'').replace(/\s/g,''),r=(f.ar||'').trim(),m=(f.am||'').trim(),u=(f.au||'').trim();
    if(!/^[\u3400-\u4DBF\u4E00-\u9FFF]{2,8}$/.test(h))return A.err('사자성어는 한자 2~8자로 입력하세요.');
    if(!r)return A.err('독음을 입력하세요.');
    if(!m)return A.err('뜻을 입력하세요.');
    if(I.some(x=>x[0]===h))return A.err('이미 공용·기본 목록에 있는 사자성어입니다.');
    SHARED.push([h,r,m,u||'등록된 유래·해설이 없습니다.']);sv('sharedDraft',SHARED);rebuild();
    S.form={};S.err='';S.msg='"'+h+'"을(를) 공용 초안에 추가했어요. 내보내기 후 업로드하면 모두에게 보입니다.';render();
  },
  adminDel(i){
    if(!confirm('"'+I[i][0]+'"을(를) 공용 목록에서 삭제할까요?'))return;
    const k=I[i][0];SHARED=SHARED.filter(x=>x[0]!==k);sv('sharedDraft',SHARED);rebuild();S.quiz=null;S.open=null;S.study=null;save();render();
  },
  adminExport(){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(SHARED,null,1)],{type:'application/json'}));
    a.download='shared-words.json';a.click();URL.revokeObjectURL(a.href);
  },
  adminReset(){
    if(!confirm('이 브라우저의 초안을 지우고 서버의 shared-words.json 상태로 되돌릴까요?'))return;
    try{localStorage.removeItem('sharedDraft')}catch(e){}location.reload();
  },
  wrongBm(){S.quiz.qs.forEach(Q=>{if(!Q.ok)S.bm.add(Q.i)});save();render();alert('틀린 문제를 북마크에 담았어요.')}
};

function render(){
  $('#app').innerHTML=S.study?vStudy():({dict:vDict,pick:vPick,quiz:vQuiz,bm:vBm,admin:vAdmin}[S.tab])();
  $('#nav').style.gridTemplateColumns='repeat('+(S.admin?5:4)+',minmax(0,1fr))';
  $('#nav').innerHTML=[['dict','단어장'],['pick','학습 선택'],['quiz','퀴즈 풀기'],['bm','북마크('+S.bm.size+')'],...(S.admin?[['admin','관리자']]:[])]
    .map(([k,l])=>`<button onclick="A.tab('${k}')" class="py-4 text-xs font-medium ${S.tab===k?'text-[#1F6F5C] border-t-2 border-[#1F6F5C] -mt-px':'text-slate-500'}">${l}</button>`).join('');
  $('#modal').innerHTML=S.open!==null?vModal():'';
  $('#back').innerHTML=(S.study||S.quiz)?BACK:'';
}
/* 공용 단어(shared-words.json) 불러오기: HTML과 같은 위치에 파일이 있고 http(s)로 열었을 때 동작 */
async function loadShared(){
  try{
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),3000);
    const res=await fetch('shared-words.json',{cache:'no-cache',signal:ac.signal});clearTimeout(t);
    if(res.ok){const d=await res.json();if(Array.isArray(d))SHARED=d.filter(okEntry).map(x=>[x[0],x[1],x[2],x[3]||'']);}
  }catch(e){}
  if(S.admin){const dr=ld('sharedDraft',null);if(Array.isArray(dr))SHARED=dr.filter(okEntry);}
}
$('#app').innerHTML='<p class="text-center text-slate-500 py-12">불러오는 중…</p>';
loadShared().finally(()=>{
  I=buildI();
  const toSet=a=>new Set((a||[]).map(v=>typeof v==='number'?(OLD[v]||[])[0]:v).map(k=>I.findIndex(x=>x[0]===k)).filter(i=>i>=0));
  S.sel=toSet(ld('sel',[]));S.bm=toSet(ld('bm',[]));render();
});
</script>
